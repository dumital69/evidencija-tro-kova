<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evidencija Troškova</title>
<meta name="description" content="Evidencija uplata i troškova po mesecima">
<meta name="theme-color" content="#0f0f13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Evidencija">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap');

  :root {
    --bg: #0f0f13;
    --surface: #18181f;
    --surface2: #1e1e28;
    --border: #2a2a38;
    --text: #e8e8f0;
    --text-dim: #7a7a92;
    --blue: #4f8ef7;
    --green: #3ecfa0;
    --yellow: #f7c948;
    --cyan: #60c5f7;
    --red: #f76060;
    --purple: #c97af7;
    --orange: #f7944f;
    --gray: #aaaaaa;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    font-size: 14px;
  }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 100;
    flex-wrap: wrap;
  }

  header h1 {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 1.2rem;
    color: var(--text);
    flex: 1;
    min-width: 150px;
  }

  .header-btns {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .hbtn {
    padding: 7px 14px;
    border-radius: 6px;
    border: 1px solid var(--border);
    font-family: 'DM Mono', monospace;
    font-size: 0.78rem;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    background: var(--surface2);
    color: var(--text);
  }

  .hbtn-export {
    color: var(--green);
    border-color: var(--green);
  }
  .hbtn-export:hover { background: var(--green); color: #000; }

  .hbtn-import {
    color: var(--blue);
    border-color: var(--blue);
  }
  .hbtn-import:hover { background: var(--blue); color: #fff; }

  .hbtn-print {
    color: var(--purple);
    border-color: var(--purple);
  }
  .hbtn-print:hover { background: var(--purple); color: #fff; }

  @media print {
    header, .tabs-wrapper, .header-btns, .add-row-btn,
    .del-row-btn, .uplata-add-btn, .tab-add, .tab-del,
    .prenos-reset-btn { display: none !important; }
    body { background: #fff !important; color: #000 !important; }
    .month-page { display: none !important; }
    .month-page.print-active { display: block !important; }
    .sum-card { border: 1px solid #ccc !important; background: #f9f9f9 !important; }
    .sum-card label, .sum-card .val, .zbir-item label, .zbir-item .zbir-val { color: #000 !important; }
    .sekcija, .uplata-sekcija, .zbir-bar, .grafikon-wrapper { 
      border: 1px solid #ccc !important; 
      background: #fff !important;
      break-inside: avoid;
    }
    .sekcija-header { color: #000 !important; }
    .sek-input, .editable-val, input[type="date"] { 
      color: #000 !important; 
      border: none !important;
      background: transparent !important;
    }
    .iznos-input { color: #c47000 !important; }
    canvas { max-width: 100% !important; }
  }

  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--surface);
    border: 1px solid var(--green);
    color: var(--green);
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 0.85rem;
    z-index: 999;
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.3s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.error { border-color: var(--red); color: var(--red); }

  input[type="date"].sek-input,
  input[type="date"].uplata-datum-inp {
    color-scheme: dark;
    cursor: pointer;
  }
  input[type="date"]::-webkit-calendar-picker-indicator {
    filter: invert(0.7);
    cursor: pointer;
    opacity: 0.6;
  }
  input[type="date"]::-webkit-calendar-picker-indicator:hover {
    opacity: 1;
  }

  .tabs-wrapper {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 12px;
    display: flex;
    align-items: center;
    gap: 2px;
    overflow-x: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .tab {
    padding: 10px 16px;
    font-family: 'DM Mono', monospace;
    font-size: 0.78rem;
    color: var(--text-dim);
    cursor: pointer;
    border: none;
    border-bottom: 2px solid transparent;
    background: none;
    white-space: nowrap;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--blue); border-bottom-color: var(--blue); }

  .tab-del {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 0.9rem;
    padding: 0 2px;
    line-height: 1;
    opacity: 0;
    transition: opacity 0.15s;
  }
  .tab:hover .tab-del { opacity: 1; }
  .tab-del:hover { color: var(--red); }

  .tab-add {
    padding: 8px 12px;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 1.2rem;
    background: none;
    border: none;
    transition: color 0.15s;
    flex-shrink: 0;
  }
  .tab-add:hover { color: var(--green); }

  .content {
    max-width: 1100px;
    margin: 0 auto;
    padding: 24px 16px 80px;
  }

  .month-page { display: none; }
  .month-page.active { display: block; }

  .summary-bar {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 10px;
    margin-bottom: 24px;
  }

  .sum-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
  }

  .sum-card label {
    font-size: 0.65rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 1px;
    display: block;
    margin-bottom: 6px;
  }

  .sum-card .val {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 1.3rem;
  }

  .editable-val {
    background: transparent;
    border: none;
    border-bottom: 1px dashed var(--border);
    color: inherit;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 1.3rem;
    width: 100%;
    outline: none;
    padding: 2px 0;
  }

  .sekcija {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 18px;
    overflow: hidden;
  }

  .sekcija-header {
    display: grid;
    grid-template-columns: 40px 1fr 140px 160px 36px;
    gap: 8px;
    padding: 10px 14px;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #fff;
    font-weight: 600;
    align-items: center;
  }

  .sekcija-header .slovo {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 0.9rem;
    color: #000;
    flex-shrink: 0;
  }

  .sek-row {
    display: grid;
    grid-template-columns: 40px 1fr 140px 160px 36px;
    gap: 8px;
    padding: 6px 14px;
    border-top: 1px solid var(--border);
    align-items: center;
  }

  .sek-row:hover { background: var(--surface2); }

  .row-num {
    color: var(--text-dim);
    font-size: 0.7rem;
    text-align: center;
  }

  .sek-input {
    background: transparent;
    border: 1px solid transparent;
    border-radius: 4px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 0.82rem;
    padding: 4px 6px;
    width: 100%;
    outline: none;
    transition: border-color 0.15s;
  }
  .sek-input:focus { border-color: var(--border); background: var(--surface2); }

  .iznos-input {
    text-align: right;
    color: var(--yellow);
  }

  .sek-footer {
    display: grid;
    grid-template-columns: 40px 1fr 140px 160px 36px;
    gap: 8px;
    padding: 8px 14px;
    border-top: 1px solid var(--border);
    background: rgba(255,255,255,0.02);
    align-items: center;
  }

  .sek-total {
    text-align: right;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 1rem;
    color: var(--yellow);
    white-space: nowrap;
    overflow: visible;
    min-width: 0;
  }

  .add-row-btn {
    background: none;
    border: 1px dashed var(--border);
    border-radius: 4px;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 1rem;
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    padding: 0;
  }
  .add-row-btn:hover { border-color: var(--green); color: var(--green); }

  .del-row-btn {
    background: none;
    border: none;
    color: transparent;
    cursor: pointer;
    font-size: 0.85rem;
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    padding: 0;
    border-radius: 4px;
  }
  .sek-row:hover .del-row-btn { color: var(--text-dim); }
  .del-row-btn:hover { color: var(--red) !important; background: rgba(247,96,96,0.1); }

  .uplata-sekcija {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 18px;
    overflow: hidden;
  }

  .uplata-header {
    padding: 10px 14px;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #fff;
    font-weight: 600;
    background: var(--blue);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .uplata-row {
    display: grid;
    grid-template-columns: 1fr 140px 160px 36px;
    gap: 8px;
    padding: 6px 14px;
    border-top: 1px solid var(--border);
    align-items: center;
  }
  .uplata-row:hover { background: var(--surface2); }

  .zbir-bar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 20px;
    margin-top: 24px;
    display: flex;
    flex-wrap: wrap;
    gap: 24px;
    align-items: center;
    justify-content: space-between;
  }

  .zbir-item { text-align: center; }
  .zbir-item label {
    display: block;
    font-size: 0.65rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 4px;
  }
  .zbir-item .zbir-val {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 1.1rem;
  }

  .razlika-pozitivna { color: var(--green); }
  .razlika-negativna { color: var(--red); }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 200;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px;
    width: 320px;
  }

  .modal h2 {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    margin-bottom: 18px;
    font-size: 1.1rem;
  }

  .modal select, .modal input[type=text] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 0.9rem;
    padding: 10px 12px;
    margin-bottom: 12px;
    outline: none;
  }

  .modal-btns { display: flex; gap: 10px; margin-top: 6px; }

  .btn {
    flex: 1;
    padding: 10px;
    border-radius: 6px;
    border: none;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 0.85rem;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .btn:hover { opacity: 0.85; }
  .btn-primary { background: var(--blue); color: #fff; }
  .btn-secondary { background: var(--border); color: var(--text); }

  .color-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    display: inline-block;
    margin-right: 4px;
  }

  @media (max-width: 600px) {
    .sekcija-header, .sek-row, .sek-footer {
      grid-template-columns: 30px 1fr 110px 110px 30px;
      gap: 4px;
      padding: 6px 8px;
    }
    .summary-bar { grid-template-columns: repeat(2, 1fr); }
  }

  #devizePage { display: none; }
  #devizePage.active { display: block; }

  .devize-summary {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }

  .devize-card {
    background: var(--surface);
    border: 1px solid var(--green);
    border-radius: 10px;
    padding: 16px 20px;
  }

  .devize-card label {
    font-size: 0.65rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 1px;
    display: block;
    margin-bottom: 6px;
  }

  .devize-card .val {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 1.6rem;
    color: var(--green);
  }

  .devize-table {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 18px;
  }

  .devize-table-header {
    display: grid;
    grid-template-columns: 120px 100px 80px 100px 80px 130px 36px;
    gap: 8px;
    padding: 10px 14px;
    background: rgba(62,207,160,0.15);
    border-bottom: 2px solid var(--green);
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--green);
    font-weight: 600;
  }

  .devize-row {
    display: grid;
    grid-template-columns: 120px 100px 80px 100px 80px 130px 36px;
    gap: 8px;
    padding: 7px 14px;
    border-top: 1px solid var(--border);
    align-items: center;
  }

  .devize-row:hover { background: var(--surface2); }

  .devize-footer {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    padding: 10px 14px;
    border-top: 1px solid var(--border);
    background: rgba(255,255,255,0.02);
    gap: 16px;
  }

  .btn-dodaj-devizu {
    background: var(--green);
    color: #000;
    border: none;
    border-radius: 6px;
    padding: 10px 20px;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 0.85rem;
    cursor: pointer;
    transition: opacity 0.15s;
    margin-bottom: 18px;
  }
  .btn-dodaj-devizu:hover { opacity: 0.85; }

  .valuta-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 0.75rem;
    font-weight: 700;
  }
  .valuta-eur { background: rgba(79,142,247,0.2); color: #4f8ef7; }
  .valuta-usd { background: rgba(62,207,160,0.2); color: #3ecfa0; }

  .grafikon-wrapper {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px 20px 16px;
    margin-top: 18px;
  }

  .grafikon-wrapper h3 {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 0.95rem;
    color: var(--text);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .grafikon-legenda {
    display: flex;
    gap: 20px;
    margin-top: 12px;
    flex-wrap: wrap;
  }

  .legenda-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.72rem;
    color: var(--text-dim);
  }

  .legenda-dot {
    width: 12px; height: 4px; border-radius: 2px;
  }
</style>
</head>
<body>
<div id="racunPickerOverlay">
  <div class="racun-picker-box">
    <div class="racun-picker-title">🏦 Odaberi račun</div>
    <div class="racun-picker-sub">Izaberi račun ili dodaj novi</div>
    <div id="racunList"></div>
    <div class="racun-novi-row">
      <input class="racun-novi-input" id="noviRacunInput" placeholder="Naziv novog računa..." maxlength="40">
      <button class="racun-novi-btn" id="noviRacunBtn">＋ Dodaj</button>
    </div>
  </div>
</div>

<header>
  <h1>💰 Evidencija Troškova</h1>
  <div id="racunHeaderBadge" class="racun-header-badge" onclick="showRacunPicker()" title="Promeni račun">
    <div>
      <div class="rh-label">Račun</div>
      <div class="rh-naziv" id="activeRacunName">—</div>
    </div>
    <span class="rh-arrow">▼</span>
  </div>
  <div class="header-btns">
    <button class="hbtn hbtn-import" id="importBtn">📂 Uvezi podatke</button>
    <button class="hbtn hbtn-print" id="printBtn">🖨️ Štampaj tab</button>
    <button class="hbtn hbtn-export" id="exportBtn">💾 Sačuvaj podatke</button>
  </div>
</header>
<input type="file" id="importFileInput" accept=".json" style="display:none">
<div class="toast" id="toast"></div>

<div class="tabs-wrapper" id="tabsWrapper">
  <button class="tab-add" id="addMonthBtn" title="Dodaj mesec">＋</button>
  <button class="tab" id="devizeTabBtn" style="color:var(--green);border-bottom:2px solid transparent;border-left:1px solid var(--border);margin-left:4px;padding-left:16px;">💶 Devize</button>
</div>

<div class="content" id="mainContent">
  <div style="color:var(--text-dim); text-align:center; margin-top:80px;">
    Kliknite <strong>＋</strong> da dodate prvi mesec.
  </div>
</div>

<div class="content" id="devizePage"></div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2>Novi Mesec</h2>
    <select id="modalMesec">
      <option value="Januar">Januar</option>
      <option value="Februar">Februar</option>
      <option value="Mart">Mart</option>
      <option value="April">April</option>
      <option value="Maj">Maj</option>
      <option value="Jun">Jun</option>
      <option value="Jul">Jul</option>
      <option value="Avgust">Avgust</option>
      <option value="Septembar">Septembar</option>
      <option value="Oktobar">Oktobar</option>
      <option value="Novembar">Novembar</option>
      <option value="Decembar">Decembar</option>
    </select>
    <select id="modalGodina"></select>
    <div class="modal-btns">
      <button class="btn btn-secondary" id="modalCancel">Otkaži</button>
      <button class="btn btn-primary" id="modalConfirm">Dodaj</button>
    </div>
  </div>
</div>

<script>
// ===================== DATA =====================
const SEKCIJE = [
  { id: 'B', naziv: 'Mobilni, post, prepaid', boja: '#f7c948', textBoja: '#000', defaultReds: 5 },
  { id: 'C', naziv: 'Fiksni, Box', boja: '#3ecfa0', textBoja: '#000', defaultReds: 5 },
  { id: 'D', naziv: 'Struja', boja: '#3ecfa0', textBoja: '#000', defaultReds: 5 },
  { id: 'E', naziv: 'Voda', boja: '#60c5f7', textBoja: '#000', defaultReds: 5 },
  { id: 'F', naziv: 'Grejanje', boja: '#f7944f', textBoja: '#000', defaultReds: 5 },
  { id: 'G', naziv: 'Porez', boja: '#f7c948', textBoja: '#000', defaultReds: 5 },
  { id: 'H', naziv: 'Upravnik', boja: '#c97af7', textBoja: '#000', defaultReds: 5 },
  { id: 'I', naziv: 'Razno', boja: '#aaaaaa', textBoja: '#000', defaultReds: 5 },
];

const DEVIZE_TIPOVI = ['Kupovina', 'Prodaja', 'Dizanje'];

// ===================== MULTI-ACCOUNT =====================
const RACUNI_KEY = 'evidencija_racuni_v1';
const OLD_KEY = 'evidencija_troskova_v2';

let racuni = { list: [], activeId: null };
let state = { months: [], devize: [], stanjeEvra: 0 };

function genRacunId() { return 'r_' + Math.random().toString(36).substr(2,9); }

function fixStateFields(s) {
  if (!s.devize) s.devize = [];
  if (s.stanjeEvra === undefined) s.stanjeEvra = 0;
  s.months.forEach(m => { if (!m.devizeJ) m.devizeJ = []; });
  return s;
}

function loadState() {
  try {
    const r = localStorage.getItem(RACUNI_KEY);
    if (r) {
      racuni = JSON.parse(r);
      if (!racuni.list) racuni.list = [];
      if (racuni.activeId) {
        const active = racuni.list.find(x => x.id === racuni.activeId);
        if (active && active.data) {
          state = fixStateFields(active.data);
          return;
        }
      }
    } else {
      const old = localStorage.getItem(OLD_KEY);
      if (old) {
        const oldData = fixStateFields(JSON.parse(old));
        const id = genRacunId();
        racuni = { list: [{ id, naziv: 'Moj račun', data: oldData }], activeId: id };
        state = oldData;
        saveState();
        return;
      }
    }
    state = { months: [], devize: [], stanjeEvra: 0 };
  } catch(e) { console.error(e); }
}

function saveState() {
  const active = racuni.list.find(x => x.id === racuni.activeId);
  if (active) active.data = state;
  localStorage.setItem(RACUNI_KEY, JSON.stringify(racuni));
}

function updateRacunHeader() {
  const el = document.getElementById('activeRacunName');
  if (!el) return;
  const active = racuni.list.find(x => x.id === racuni.activeId);
  el.textContent = active ? active.naziv : '—';
}

function switchRacun(id) {
  const current = racuni.list.find(x => x.id === racuni.activeId);
  if (current) current.data = state;
  racuni.activeId = id;
  const active = racuni.list.find(x => x.id === id);
  if (active && active.data) {
    state = fixStateFields(active.data);
  } else {
    state = { months: [], devize: [], stanjeEvra: 0 };
    if (active) active.data = state;
  }
  saveState();
  activeTab = getSavedTab(id);
  updateRacunHeader();
  hideRacunPicker();
  render();
}

function addRacun(naziv) {
  naziv = naziv.trim();
  if (!naziv) return;
  const id = genRacunId();
  racuni.list.push({ id, naziv, data: { months: [], devize: [], stanjeEvra: 0 } });
  switchRacun(id);
}

function deleteRacun(e, id) {
  e.stopPropagation();
  if (racuni.list.length <= 1) { alert('Ne možete obrisati jedini račun!'); return; }
  if (!confirm('Obrisati ovaj račun i sve podatke?')) return;
  racuni.list = racuni.list.filter(x => x.id !== id);
  if (racuni.activeId === id) {
    switchRacun(racuni.list[0].id);
  } else {
    saveState();
    renderRacunPicker();
  }
}

function renderRacunPicker() {
  const list = document.getElementById('racunList');

  list.innerHTML = racuni.list.map(r => `

      ${r.id === racuni.activeId ? '<div class="racun-active-badge">Aktivan</div>' : ''}

}

function showRacunPicker() {

}

function hideRacunPicker() {

function fmt(n) {
  if (!n && n !== 0) return '0,00';
  return Number(n).toLocaleString('sr-RS', {minimumFractionDigits: 2, maximumFractionDigits: 2});
}

function parseNum(s) {
  if (s === null || s === undefined || s === '') return 0;
  if (typeof s === 'number') return s;
  const str = String(s).trim();
  if (str.includes(',')) {
    return parseFloat(str.replace(/\./g, '').replace(',', '.')) || 0;
  } else if ((str.match(/\./g) || []).length > 1) {
    return parseFloat(str.replace(/\./g, '')) || 0;
  } else {
    return parseFloat(str) || 0;
  }
}

function genId() { return '_' + Math.random().toString(36).substr(2,9); }

function blankRow() { return { id: genId(), naziv: '', datum: '', iznos: '' }; }

const MESEC_BROJ = {
  'Januar': 1, 'Februar': 2, 'Mart': 3, 'April': 4,
  'Maj': 5, 'Jun': 6, 'Jul': 7, 'Avgust': 8,
  'Septembar': 9, 'Oktobar': 10, 'Novembar': 11, 'Decembar': 12
};

function monthSortKey(m) {
  const g = parseInt(m.godina) || 0;
  const mn = MESEC_BROJ[m.mesec] || 0;
  return g * 100 + mn;
}

function sortMonths() {
  state.months.sort((a, b) => monthSortKey(a) - monthSortKey(b));
}

function blankMonth(mesec, godina, prenosi, prevMonth) {
  const sek = {};
  SEKCIJE.forEach(s => {
    if (prevMonth && prevMonth.sekcije[s.id]) {
      const prevRows = prevMonth.sekcije[s.id].filter(r => r.naziv && r.naziv.trim() !== '');
      if (prevRows.length > 0) {
        sek[s.id] = prevRows.map(r => ({ id: genId(), naziv: r.naziv, datum: '', iznos: '' }));
        sek[s.id].push(blankRow());
      } else {
        sek[s.id] = Array.from({length: s.defaultReds}, blankRow);
      }
    } else {
      sek[s.id] = Array.from({length: s.defaultReds}, blankRow);
    }
  });

  let uplate = [blankRow()];
  if (prevMonth && prevMonth.uplate) {
    const prevUplate = prevMonth.uplate.filter(r => r.naziv && r.naziv.trim() !== '');
    if (prevUplate.length > 0) {
      uplate = prevUplate.map(r => ({ id: genId(), naziv: r.naziv, datum: '', iznos: '' }));
      uplate.push(blankRow());
    }
  }

  return {
    id: genId(),
    naziv: mesec + ' ' + godina,
    mesec, godina,
    prenos: prenosi || 0,
    plata: 0,
    uplate,
    sekcije: sek,
    devizeJ: []
  };
}

function calcMonth(m) {
  const prenos = parseNum(m.prenos);
  const plata = parseNum(m.plata);
  const ukUplata = m.uplate.reduce((a, r) => a + parseNum(r.iznos), 0);

  const devJ = m.devizeJ || [];
  const devDinUticaj = devJ.reduce((a, r) => {
    const din = parseNum(r.dinari);
    if (r.tip === 'Kupovina') return a - din;
    if (r.tip === 'Prodaja') return a + din;
    return a;
  }, 0);

  const totalUplata = prenos + plata + ukUplata + devDinUticaj;

  let troskovi = {};
  let totalTroskovi = 0;
  SEKCIJE.forEach(s => {
    const t = (m.sekcije[s.id] || []).reduce((a, r) => a + parseNum(r.iznos), 0);
    troskovi[s.id] = t;
    totalTroskovi += t;
  });

  const stanjeEvra = devJ.reduce((a, r) => {
    const eur = parseNum(r.evri);
    if (r.tip === 'Kupovina') return a + eur;
    if (r.tip === 'Prodaja') return a - eur;
    if (r.tip === 'Dizanje') return a - eur;
    return a;
  }, 0);

  const razlika = totalUplata - totalTroskovi;
  return { prenos, plata, ukUplata, devDinUticaj, totalUplata, troskovi, totalTroskovi, razlika, stanjeEvra };
}

// ===== PAMĆENJE AKTIVNOG TABA =====
function getSavedTab(accountId) {
    const saved = localStorage.getItem('activeTab_' + accountId);
    return saved ? parseInt(saved) : 0;
}

function saveActiveTab(accountId, tabIndex) {
    localStorage.setItem('activeTab_' + accountId, tabIndex);
}
let activeTab = 0;

function render() {
  if (devizePageActive) return;
  
  if (racuni.activeId) {
    const saved = getSavedTab(racuni.activeId);
    if (saved < state.months.length) {
      activeTab = saved;
    } else {
      activeTab = Math.max(0, state.months.length - 1);
    }
  }
  
  renderTabs();
  renderContent();
}

function renderTabs() {
  const wrapper = document.getElementById('tabsWrapper');
  const addBtn = document.getElementById('addMonthBtn');
  wrapper.innerHTML = '';

  state.months.forEach((m, idx) => {
    const tab = document.createElement('button');
    tab.className = 'tab' + (idx === activeTab ? ' active' : '');
    tab.innerHTML = `<span>${m.naziv}</span><button class="tab-del" title="Obriši mesec" onclick="deleteMonth(event,'${m.id}')">✕</button>`;
    tab.addEventListener('click', (e) => {
      if (e.target.classList.contains('tab-del')) return;
      activeTab = idx;
      saveActiveTab(racuni.activeId, idx);
      render();
    });
    wrapper.appendChild(tab);
  });

  wrapper.appendChild(addBtn);

  requestAnimationFrame(() => {
    const activeTabEl = wrapper.querySelector('.tab.active');
    if (activeTabEl) {
      activeTabEl.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    }
  });
}

function renderContent() {
  const content = document.getElementById('mainContent');
  content.innerHTML = '';

  if (state.months.length === 0) {
    content.innerHTML = '<div style="color:var(--text-dim);text-align:center;margin-top:80px;">Kliknite <strong>＋</strong> da dodate prvi mesec.</div>';
    return;
  }

  state.months.forEach((m, idx) => {
    const page = document.createElement('div');
    page.className = 'month-page' + (idx === activeTab ? ' active' : '');
    page.id = 'page_' + m.id;
    page.innerHTML = buildMonthHTML(m);
    content.appendChild(page);
  });

  state.months.forEach(m => attachListeners(m));
  requestAnimationFrame(() => {
    state.months.forEach(m => drawChart(m));
    state.months.forEach(m => drawEvraChart(m));
  });
}

function calcUkupnoEvra(m) {
  const idx = state.months.indexOf(m);
  let total = 0;
  for (let i = 0; i <= idx; i++) {
    const devJ = state.months[i].devizeJ || [];
    devJ.forEach(r => {
      const eur = parseNum(r.evri);
      if (r.tip === 'Kupovina') total += eur;
      else if (r.tip === 'Prodaja') total -= eur;
      else if (r.tip === 'Dizanje') total -= eur;
    });
  }
  return total;
}

  return summaryHTML + uplateHTML + sekHTML + devizeJHTML + stanjeEvraHTML + zbirHTML + grafikonHTML + grafikonEvraHTML;
}

function getDaysInMonth(mesec, godina) {
  const mesecMap = {
    'Januar': 1, 'Februar': 2, 'Mart': 3, 'April': 4,
    'Maj': 5, 'Jun': 6, 'Jul': 7, 'Avgust': 8,
    'Septembar': 9, 'Oktobar': 10, 'Novembar': 11, 'Decembar': 12
  };
  const mn = mesecMap[mesec] || 1;
  return new Date(godina, mn, 0).getDate();
}

function parseDate(dateStr) {
  if (!dateStr) return null;
  const d = new Date(dateStr);
  if (isNaN(d)) return null;
  return d.getDate();
}

function buildChartData(m) {
  const days = getDaysInMonth(m.mesec, parseInt(m.godina));
  const prihodi = new Array(days + 1).fill(0);
  const troskovi = new Array(days + 1).fill(0);

  const prenos = parseNum(m.prenos);
  const plata = parseNum(m.plata);

  m.uplate.forEach(r => {
    const iznos = parseNum(r.iznos);
    if (!iznos) return;
    const day = parseDate(r.datum) || 1;
    const d = Math.min(Math.max(day, 1), days);
    prihodi[d] += iznos;
  });

  prihodi[1] += plata;
  prihodi[1] += prenos;

  Object.values(m.sekcije).forEach(rows => {
    rows.forEach(r => {
      const iznos = parseNum(r.iznos);
      if (!iznos) return;
      const day = parseDate(r.datum) || 1;
      const d = Math.min(Math.max(day, 1), days);
      troskovi[d] += iznos;
    });
  });

  let balance = 0;
  const balanceData = [];
  const prihodiData = [];
  const troškoviData = [];
  let cumPrihodi = 0;
  let cumTroskovi = 0;

  for (let d = 1; d <= days; d++) {
    cumPrihodi += prihodi[d];
    cumTroskovi += troskovi[d];
    balance += prihodi[d] - troskovi[d];
    balanceData.push(balance);
    prihodiData.push(cumPrihodi);
    troškoviData.push(cumTroskovi);
  }

  return { days, balanceData, prihodiData, troškoviData };
}function drawChart(m) {
  const canvas = document.getElementById('chart_' + m.id);
  if (!canvas) return;

  const dpr = window.devicePixelRatio || 1;
  const displayW = canvas.parentElement.clientWidth - 40;
  canvas.width = displayW * dpr;
  canvas.height = 300 * dpr;
  canvas.style.width = displayW + 'px';
  canvas.style.height = '300px';

  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  const W = displayW;
  const H = 300;
  const PAD_LEFT = 80;
  const PAD_RIGHT = 20;
  const PAD_TOP = 20;
  const PAD_BOTTOM = 40;
  const chartW = W - PAD_LEFT - PAD_RIGHT;
  const chartH = H - PAD_TOP - PAD_BOTTOM;

  const { days, balanceData, prihodiData, troškoviData } = buildChartData(m);

  const allVals = [...balanceData, ...prihodiData, ...troškoviData];
  const maxVal = Math.max(...allVals, 5000);
  const minVal = Math.min(...allVals, 0);

  const step = niceStep(maxVal - minVal, 8);
  const yMin = Math.floor(minVal / step) * step;
  const yMax = Math.ceil(maxVal / step) * step;

  function toX(day) {
    return PAD_LEFT + ((day - 1) / (days - 1)) * chartW;
  }
  function toY(val) {
    return PAD_TOP + chartH - ((val - yMin) / (yMax - yMin)) * chartH;
  }

  ctx.fillStyle = '#18181f';
  ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = '#2a2a38';
  ctx.lineWidth = 1;
  ctx.fillStyle = '#7a7a92';
  ctx.font = '10px DM Mono, monospace';
  ctx.textAlign = 'right';

  let y = yMin;
  while (y <= yMax + 0.001) {
    const cy = toY(y);
    ctx.beginPath();
    ctx.moveTo(PAD_LEFT, cy);
    ctx.lineTo(PAD_LEFT + chartW, cy);
    ctx.stroke();
    ctx.fillText(fmtShort(y), PAD_LEFT - 6, cy + 4);
    y = Math.round((y + step) * 100) / 100;
  }

  if (yMin < 0 && yMax > 0) {
    ctx.strokeStyle = '#555570';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(PAD_LEFT, toY(0));
    ctx.lineTo(PAD_LEFT + chartW, toY(0));
    ctx.stroke();
  }

  ctx.strokeStyle = '#2a2a38';
  ctx.lineWidth = 1;
  ctx.fillStyle = '#7a7a92';
  ctx.textAlign = 'center';
  ctx.font = '10px DM Mono, monospace';
  for (let d = 1; d <= days; d++) {
    if (d === 1 || d % 7 === 0 || d === days) {
      const cx = toX(d);
      ctx.beginPath();
      ctx.moveTo(cx, PAD_TOP);
      ctx.lineTo(cx, PAD_TOP + chartH);
      ctx.stroke();
      ctx.fillText(d + '.', cx, PAD_TOP + chartH + 16);
    }
  }

  ctx.beginPath();
  ctx.moveTo(toX(1), toY(balanceData[0]));
  for (let i = 1; i < days; i++) {
    ctx.lineTo(toX(i + 1), toY(balanceData[i]));
  }
  ctx.lineTo(toX(days), toY(yMin));
  ctx.lineTo(toX(1), toY(yMin));
  ctx.closePath();
  ctx.fillStyle = 'rgba(63,207,160,0.08)';
  ctx.fill();

  function drawLine(data, color, width) {
    ctx.beginPath();
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineJoin = 'round';
    ctx.moveTo(toX(1), toY(data[0]));
    for (let i = 1; i < days; i++) {
      ctx.lineTo(toX(i + 1), toY(data[i]));
    }
    ctx.stroke();
  }

  drawLine(prihodiData, '#4f8ef7', 1.5);
  drawLine(troškoviData, '#f76060', 1.5);
  drawLine(balanceData, '#3ecfa0', 2.5);

  for (let i = 0; i < days; i++) {
    const d = i + 1;
    const hasData = balanceData[i] !== (i > 0 ? balanceData[i-1] : 0);
    if (hasData || d === 1 || d === days) {
      ctx.beginPath();
      ctx.arc(toX(d), toY(balanceData[i]), 3, 0, Math.PI * 2);
      ctx.fillStyle = '#3ecfa0';
      ctx.fill();
    }
  }
}

function niceStep(range, targetSteps) {
  const raw = range / targetSteps;
  const magnitude = Math.pow(10, Math.floor(Math.log10(raw)));
  const nice = [1, 2, 2.5, 5, 10];
  for (const n of nice) {
    if (n * magnitude >= raw) return n * magnitude;
  }
  return 10 * magnitude;
}

function fmtShort(n) {
  if (Math.abs(n) >= 1000000) return (n/1000000).toFixed(1) + 'M';
  if (Math.abs(n) >= 1000) return (n/1000).toFixed(0) + 'k';
  return n.toFixed(0);
}

function drawEvraChart(m) {
  const canvas = document.getElementById('chartEvra_' + m.id);
  if (!canvas) return;

  const mIdx = state.months.indexOf(m);
  const hasAny = state.months.slice(0, mIdx + 1).some(mm => (mm.devizeJ||[]).some(r => parseNum(r.evri) > 0));
  if (!hasAny) return;

  const dpr = window.devicePixelRatio || 1;
  const displayW = canvas.parentElement.clientWidth - 40;
  canvas.width = displayW * dpr;
  canvas.height = 200 * dpr;
  canvas.style.width = displayW + 'px';
  canvas.style.height = '200px';

  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  const W = displayW;
  const H = 200;
  const PAD_LEFT = 65;
  const PAD_RIGHT = 20;
  const PAD_TOP = 16;
  const PAD_BOTTOM = 30;
  const chartW = W - PAD_LEFT - PAD_RIGHT;
  const chartH = H - PAD_TOP - PAD_BOTTOM;

  const allTransakcije = [];
  state.months.slice(0, mIdx + 1).forEach(mm => {
    (mm.devizeJ || []).forEach(r => {
      if (parseNum(r.evri) > 0) {
        allTransakcije.push({ datum: r.datum || '', tip: r.tip, evri: parseNum(r.evri), mesec: mm.naziv });
      }
    });
  });
  allTransakcije.sort((a, b) => {
    if (!a.datum) return 1;
    if (!b.datum) return -1;
    return a.datum.localeCompare(b.datum);
  });

  if (allTransakcije.length === 0) return;

  let cum = 0;
  const tacke = [];
  tacke.push({ label: '', val: 0 });
  allTransakcije.forEach(t => {
    if (t.tip === 'Kupovina') cum += t.evri;
    else cum -= t.evri;
    tacke.push({ label: t.datum ? t.datum.slice(5).replace('-', '.') : t.mesec, val: cum });
  });

  const vals = tacke.map(t => t.val);
  const maxVal = Math.max(...vals, 1);
  const minVal = Math.min(...vals, 0);
  const step = niceStep(maxVal - minVal || maxVal, 5);
  const yMin = Math.floor(minVal / step) * step;
  const yMax = Math.ceil(maxVal / step) * step;

  const n = tacke.length;
  function toX(i) { return PAD_LEFT + (i / Math.max(n - 1, 1)) * chartW; }
  function toY(val) { return PAD_TOP + chartH - ((val - yMin) / Math.max(yMax - yMin, 1)) * chartH; }

  ctx.fillStyle = '#18181f';
  ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = '#2a2a38';
  ctx.lineWidth = 1;
  ctx.fillStyle = '#7a7a92';
  ctx.font = '10px DM Mono, monospace';
  ctx.textAlign = 'right';
  let y = yMin;
  while (y <= yMax + 0.001) {
    const cy = toY(y);
    ctx.beginPath(); ctx.moveTo(PAD_LEFT, cy); ctx.lineTo(PAD_LEFT + chartW, cy); ctx.stroke();
    ctx.fillText(y.toFixed(0) + '€', PAD_LEFT - 4, cy + 4);
    y = Math.round((y + step) * 100) / 100;
  }

  ctx.textAlign = 'center';
  ctx.fillStyle = '#7a7a92';
  tacke.forEach((t, i) => {
    if (t.label) ctx.fillText(t.label, toX(i), PAD_TOP + chartH + 16);
  });

  ctx.beginPath();
  ctx.moveTo(toX(0), toY(tacke[0].val));
  for (let i = 1; i < n; i++) ctx.lineTo(toX(i), toY(tacke[i].val));
  ctx.lineTo(toX(n - 1), toY(yMin));
  ctx.lineTo(toX(0), toY(yMin));
  ctx.closePath();
  ctx.fillStyle = 'rgba(79,142,247,0.12)';
  ctx.fill();

  ctx.beginPath();
  ctx.strokeStyle = '#4f8ef7';
  ctx.lineWidth = 2.5;
  ctx.lineJoin = 'round';
  ctx.moveTo(toX(0), toY(tacke[0].val));
  for (let i = 1; i < n; i++) ctx.lineTo(toX(i), toY(tacke[i].val));
  ctx.stroke();

  tacke.forEach((t, i) => {
    if (i === 0) return;
    ctx.beginPath();
    ctx.arc(toX(i), toY(t.val), 4, 0, Math.PI * 2);
    ctx.fillStyle = '#4f8ef7';
    ctx.fill();
    ctx.fillStyle = '#4f8ef7';
    ctx.font = '9px DM Mono, monospace';
    ctx.textAlign = 'center';
    ctx.fillText(t.val.toFixed(0) + '€', toX(i), toY(t.val) - 8);
  });
}

      cascadePrenosFrom(idx2 + 1);

function rerenderMonth(mid) {
  const m = getMonth(mid);
  if (!m) return;
  const page = document.getElementById('page_' + mid);
  if (!page) return;
  page.innerHTML = buildMonthHTML(m);
  attachListeners(m);
  requestAnimationFrame(() => { drawChart(m); drawEvraChart(m); });
}

function getMonth(mid) {
  return state.months.find(m => m.id === mid);
}

function cascadePrenosFrom(startIdx) {
  for (let i = startIdx; i < state.months.length; i++) {
    if (i === 0) continue;
    const prev = state.months[i - 1];
    const lc = calcMonth(prev);
    state.months[i].prenos = Math.round(lc.razlika * 100) / 100;
  }
}

function onMonthChanged(mid) {
  const idx = state.months.findIndex(m => m.id === mid);
  if (idx === -1) return;
  cascadePrenosFrom(idx + 1);
  saveState();
  for (let i = idx; i < state.months.length; i++) {
    rerenderMonth(state.months[i].id);
  }
}// ===================== TABS / MONTHS =====================
function deleteMonth(e, mid) {
  e.stopPropagation();
  if (!confirm('Obrisati ovaj mesec?')) return;
  const idx = state.months.findIndex(m => m.id === mid);
  state.months.splice(idx, 1);
  if (activeTab >= state.months.length) activeTab = Math.max(0, state.months.length - 1);
  saveActiveTab(racuni.activeId, activeTab);
  saveState();
  render();
}

document.getElementById('addMonthBtn').addEventListener('click', () => {
  document.getElementById('modalOverlay').classList.add('open');
});
document.getElementById('modalCancel').addEventListener('click', () => {
  document.getElementById('modalOverlay').classList.remove('open');
});
document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) document.getElementById('modalOverlay').classList.remove('open');
});

const yearSel = document.getElementById('modalGodina');
const curYear = new Date().getFullYear();
for (let y = 2000; y <= 2099; y++) {
  const opt = document.createElement('option');
  opt.value = y; opt.textContent = y;
  if (y === curYear) opt.selected = true;
  yearSel.appendChild(opt);
}

document.getElementById('modalConfirm').addEventListener('click', () => {
  const mesec = document.getElementById('modalMesec').value;
  const godina = document.getElementById('modalGodina').value;

  let prenos = 0;
  let prevMonth = null;
  if (state.months.length > 0) {
    prevMonth = state.months[state.months.length - 1];
    const lc = calcMonth(prevMonth);
    prenos = lc.razlika;
  }

  const nm = blankMonth(mesec, godina, prenos, prevMonth);
  state.months.push(nm);
  sortMonths();
  activeTab = state.months.findIndex(m => m.id === nm.id);
  saveActiveTab(racuni.activeId, activeTab);
  cascadePrenosFrom(1);
  saveState();
  document.getElementById('modalOverlay').classList.remove('open');
  render();
});

// ===================== PRINT =====================
document.getElementById('printBtn').addEventListener('click', () => {
  document.querySelectorAll('.month-page').forEach(el => el.classList.remove('print-active'));
  const pages = document.querySelectorAll('.month-page');
  if (pages[activeTab]) pages[activeTab].classList.add('print-active');
  window.print();
});

// ===================== EXPORT / IMPORT =====================
function showToast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(() => { t.className = 'toast'; }, 3000);
}

document.getElementById('exportBtn').addEventListener('click', async () => {
  const current = racuni.list.find(x => x.id === racuni.activeId);
  if (current) current.data = state;

  const exportData = { racuni: racuni, version: 2 };
  const dataStr = JSON.stringify(exportData, null, 2);
  const now = new Date();
  const datum = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');
  const fileName = 'evidencija_troskova_' + datum + '.json';

  if (window.showSaveFilePicker) {
    try {
      const fileHandle = await window.showSaveFilePicker({
        suggestedName: fileName,
        types: [{ description: 'JSON fajl', accept: { 'application/json': ['.json'] } }]
      });
      const writable = await fileHandle.createWritable();
      await writable.write(dataStr);
      await writable.close();
      showToast('✅ Podaci uspešno sačuvani!');
      return;
    } catch (e) {
      if (e.name === 'AbortError') return;
    }
  }

  const blob = new Blob([dataStr], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = fileName;
  a.click();
  URL.revokeObjectURL(url);
  showToast('✅ Podaci sačuvani u Downloads folder!');
});

document.getElementById('importBtn').addEventListener('click', () => {
  document.getElementById('importFileInput').click();
});

document.getElementById('importFileInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = evt => {
    try {
      const parsed = JSON.parse(evt.target.result);
      if (!confirm('Da li želite da zamenite sve postojeće podatke uvezenim podacima?')) return;

      if (parsed.version === 2 && parsed.racuni) {
        racuni = parsed.racuni;
        if (!racuni.list || racuni.list.length === 0) throw new Error('Nema računa');
        const active = racuni.list.find(x => x.id === racuni.activeId) || racuni.list[0];
        racuni.activeId = active.id;
        state = fixStateFields(active.data);
      } else if (parsed.months) {
        const active = racuni.list.find(x => x.id === racuni.activeId);
        const data = fixStateFields(parsed);
        if (active) {
          active.data = data;
        }
        state = data;
      } else {
        throw new Error('Neispravan format');
      }

      sortMonths();
      cascadePrenosFrom(1);
      activeTab = getSavedTab(racuni.activeId);
      saveState();
      updateRacunHeader();
      render();
      showToast('✅ Podaci uspešno uvezeni!');
    } catch(err) {
      showToast('❌ Greška: Neispravan fajl!', true);
    }
    e.target.value = '';
  };
  reader.readAsText(file);
});

// ===================== DEVIZE =====================
let devizePageActive = false;

function blankDevizaRow() {
  return { id: genId(), datum: '', mesec: '', valuta: 'EUR', iznos: 0, kurs: 0, dinari: 0, napomena: '' };
}

function calcDevize() {
  const eur = state.devize.filter(r => r.valuta === 'EUR').reduce((a, r) => a + parseNum(r.iznos), 0);
  const usd = state.devize.filter(r => r.valuta === 'USD').reduce((a, r) => a + parseNum(r.iznos), 0);
  return { eur, usd };
}

function getLastKurs(valuta) {
  const rows = state.devize.filter(r => r.valuta === valuta && parseNum(r.kurs) > 0);
  if (rows.length === 0) return valuta === 'EUR' ? 117 : 108;
  return parseNum(rows[rows.length - 1].kurs);
}

function renderDevizePage() {
  const page = document.getElementById('devizePage');
  if (!page) return;

  const { eur, usd } = calcDevize();

  const eurRows = state.devize.filter(r => r.valuta === 'EUR');
  const usdRows = state.devize.filter(r => r.valuta === 'USD');

  function buildTable(rows, valuta, symbol, cls) {
    if (rows.length === 0 && valuta === 'USD') return '';
    const rowsHTML = rows.map((r, ri) => `
      <div class="devize-row">
        <input type="date" class="sek-input dev-datum" data-id="${r.id}" value="${r.datum}">
        <input class="sek-input dev-mesec" data-id="${r.id}" placeholder="Mesec/god." value="${r.mesec}">
        <div><span class="valuta-badge ${cls}">${symbol}</span></div>
        <input class="sek-input dev-iznos" data-id="${r.id}" placeholder="0" value="${r.iznos}" style="text-align:right;">
        <input class="sek-input dev-kurs" data-id="${r.id}" placeholder="kurs" value="${r.kurs}" style="text-align:right;">
        <input class="sek-input iznos-input dev-dinari" data-id="${r.id}" placeholder="0,00" value="${r.dinari}" style="text-align:right;">
        <button class="del-row-btn dev-del-btn" data-id="${r.id}" title="Obriši">✕</button>
      </div>`).join('');

    const total = rows.reduce((a, r) => a + parseNum(r.iznos), 0);
    const totalDin = rows.reduce((a, r) => a + parseNum(r.dinari), 0);

    return `
      <div class="devize-table">
        <div class="devize-table-header" style="background:rgba(${valuta==='EUR'?'79,142,247':'62,207,160'},0.15);border-color:${valuta==='EUR'?'var(--blue)':'var(--green)'};">
          <span>Datum</span><span>Mesec</span><span>Valuta</span>
          <span style="text-align:right">${symbol} iznos</span>
          <span style="text-align:right">Kurs</span>
          <span style="text-align:right">Dinara</span>
          <span></span>
        </div>
        ${rowsHTML}
        <div class="devize-footer">
          <span style="color:var(--text-dim);font-size:0.8rem;">Ukupno: <strong style="color:${valuta==='EUR'?'var(--blue)':'var(--green)'}">${fmt(total)} ${symbol}</strong> = <strong style="color:var(--yellow)">${fmt(totalDin)} RSD</strong></span>
          <button class="add-row-btn dev-add-btn" data-valuta="${valuta}" title="Dodaj kupovinu">＋</button>
        </div>
      </div>`;
  }

  page.innerHTML = `
    <div class="devize-summary">
      <div class="devize-card" style="border-color:var(--blue)">
        <label>Stanje € Euro</label>
        <div class="val" style="color:var(--blue)">${fmt(eur)} €</div>
      </div>
      <div class="devize-card" style="border-color:var(--green)">
        <label>Stanje $ Dolar</label>
        <div class="val" style="color:var(--green)">${fmt(usd)} $</div>
      </div>
      <div class="devize-card" style="border-color:var(--yellow)">
        <label>Ukupno utrošeno (RSD)</label>
        <div class="val" style="color:var(--yellow)">${fmt(
          state.devize.reduce((a, r) => a + parseNum(r.dinari), 0)
        )}</div>
      </div>
    </div>

    <h3 style="font-family:'Syne',sans-serif;font-weight:700;color:var(--blue);margin-bottom:12px;">💶 Euro (€)</h3>
    ${buildTable(eurRows, 'EUR', '€', 'valuta-eur')}

    <h3 style="font-family:'Syne',sans-serif;font-weight:700;color:var(--green);margin-bottom:12px;margin-top:8px;">💵 Dolar ($)</h3>
    ${buildTable(usdRows, 'USD', '$', 'valuta-usd')}
  `;

  page.querySelectorAll('.dev-datum').forEach(el => {
    el.addEventListener('change', e => {
      const r = state.devize.find(x => x.id === e.target.dataset.id);
      if (r) { r.datum = e.target.value; saveState(); }
    });
  });

  page.querySelectorAll('.dev-mesec').forEach(el => {
    el.addEventListener('change', e => {
      const r = state.devize.find(x => x.id === e.target.dataset.id);
      if (r) { r.mesec = e.target.value; saveState(); }
    });
  });

  page.querySelectorAll('.dev-iznos').forEach(el => {
    el.addEventListener('change', e => {
      const r = state.devize.find(x => x.id === e.target.dataset.id);
      if (r) {
        r.iznos = parseNum(e.target.value);
        if (parseNum(r.kurs) > 0) {
          r.dinari = Math.round(r.iznos * parseNum(r.kurs) * 100) / 100;
        }
        saveState(); renderDevizePage();
      }
    });
  });

  page.querySelectorAll('.dev-kurs').forEach(el => {
    el.addEventListener('change', e => {
      const r = state.devize.find(x => x.id === e.target.dataset.id);
      if (r) {
        r.kurs = parseNum(e.target.value);
        if (parseNum(r.iznos) > 0) {
          r.dinari = Math.round(r.iznos * r.kurs * 100) / 100;
        }
        saveState(); renderDevizePage();
      }
    });
  });

  page.querySelectorAll('.dev-dinari').forEach(el => {
    el.addEventListener('change', e => {
      const r = state.devize.find(x => x.id === e.target.dataset.id);
      if (r) { r.dinari = parseNum(e.target.value); saveState(); renderDevizePage(); }
    });
  });

  page.querySelectorAll('.dev-del-btn').forEach(el => {
    el.addEventListener('click', e => {
      if (!confirm('Obrisati ovaj unos?')) return;
      state.devize = state.devize.filter(x => x.id !== e.target.dataset.id);
      saveState(); renderDevizePage();
    });
  });

  page.querySelectorAll('.dev-add-btn').forEach(el => {
    el.addEventListener('click', e => {
      const valuta = e.target.dataset.valuta;
      const kurs = getLastKurs(valuta);
      const row = blankDevizaRow();
      row.valuta = valuta;
      row.kurs = kurs;
      state.devize.push(row);
      saveState(); renderDevizePage();
    });
  });
}

function showDevizePage() {
  devizePageActive = true;
  document.getElementById('mainContent').style.display = 'none';
  document.getElementById('devizePage').classList.add('active');
  document.getElementById('devizeTabBtn').style.borderBottomColor = 'var(--green)';
  document.getElementById('devizeTabBtn').style.color = 'var(--green)';
  renderDevizePage();
}

function hideDevizePage() {
  devizePageActive = false;
  document.getElementById('mainContent').style.display = 'block';
  document.getElementById('devizePage').classList.remove('active');
  document.getElementById('devizeTabBtn').style.borderBottomColor = 'transparent';
  document.getElementById('devizeTabBtn').style.color = 'var(--text-dim)';
}

loadState();

document.getElementById('noviRacunBtn').addEventListener('click', () => {
  const inp = document.getElementById('noviRacunInput');
  if (inp.value.trim()) { addRacun(inp.value); inp.value = ''; }

  if (e.target === document.getElementById('racunPickerOverlay') && racuni.activeId) {
    hideRacunPicker();
  }
});

updateRacunHeader();

if (racuni.list.length === 0) {
  showRacunPicker();
}

document.getElementById('devizeTabBtn').addEventListener('click', () => {
  if (devizePageActive) {
    hideDevizePage();
    render();
  } else {
    showDevizePage();
  }
});

(function() {
  if (state.months.length === 0) return;
  const now = new Date();
  const curYear = now.getFullYear();
  const mesecNazivi = ['Januar','Februar','Mart','April','Maj','Jun',
                       'Jul','Avgust','Septembar','Oktobar','Novembar','Decembar'];
  const curMesec = mesecNazivi[now.getMonth()];
  let idx = state.months.findIndex(m => m.mesec === curMesec && parseInt(m.godina) === curYear);
  if (idx !== -1) {
    activeTab = idx;
  } else {
    activeTab = state.months.length - 1;
  }
})();

render();
</script>
